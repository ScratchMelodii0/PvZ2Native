; PvZ2Native -- first boot of PvZ2 9.6.1 (Reflourished 1.3.1, armeabi-v7a).
;
; The .so directory matters beyond the .so itself: the loader now maps every
; DT_NEEDED library that sits BESIDE it, so libc++_shared.so and libNimble.so
; must stay in that folder. Move or rename either and their 119 symbols fall
; back to host trampolines that do not exist -- the boot would die in a
; constructor with no obvious cause.
;
; Both Reflourished APKs are versionCode 675, so this .obb pairs with 1.3.1.

[paths]
so  = E:\Juegos\PvZ 2\pvz2rfl1.3.1\libPVZ2.so
obb = D:\APKS\main.675.com.ea.game.pvz2_rfl.obb

[log]
; On for the first run: one banner per .init_array entry and per lifecycle call.
; This is what says which of the 1045 constructors (1044 in libPVZ2 + 1 in
; libc++_shared) was running if the boot stops, and whether each native returned.
verbose = 1
trace = 0
pc_sample = 0

[runtime]
no_page_table = 0
heap_quarantine = 0

[gl]
debug_clear = 0
no_viewport_fix = 0
flat_fragment = 0
strict = 0

[video]
mode = auto
fullscreen = 0
fps_limit = 60

[game]
emulate_iap = 1
persist_saves = 1
; Leave at none -- the port has no network stack.
network = none
