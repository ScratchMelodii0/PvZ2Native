; Metadata. Everything under [mod] except `name` is documentation for whoever
; opens this file; the loader reads the name and ignores the rest on purpose,
; so a pack can carry notes without the log complaining about them.
[mod]
name        = Example: frame counter
author      = PvZ2Native
description = The smallest useful plugin, plus one no-op patch showing the syntax.

; A [patch] rewrites one guest instruction, no code required. Repeat the section
; for as many instructions as you like. See docs/MODDING.md.
;
; This one is deliberately inert -- `expect` names an instruction that is not
; there, so the loader reports it as skipped and writes nothing. That is what a
; patch carrying another build's address looks like in the log, which is worth
; seeing once before you rely on the check.
[patch]
comment = example: intentionally does not apply
symbol  = native.on_draw_frame
expect  = 0xDEADBEEF
write   = nop
